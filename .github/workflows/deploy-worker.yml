name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/chronex-worker/**'
      - 'packages/db/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        run: |
          echo "${{ secrets.DATABASE_URL }}"        | npx wrangler secret put DATABASE_URL        --name chronex-worker
          echo "${{ secrets.DISCORD_BOT_TOKEN }}"   | npx wrangler secret put DISCORD_BOT_TOKEN   --name chronex-worker
          echo "${{ secrets.B2_KEY_ID }}"           | npx wrangler secret put B2_KEY_ID           --name chronex-worker
          echo "${{ secrets.B2_APP_KEY }}"          | npx wrangler secret put B2_APP_KEY          --name chronex-worker
          echo "${{ secrets.B2_BUCKET_ID }}"        | npx wrangler secret put B2_BUCKET_ID        --name chronex-worker
          echo "${{ secrets.B2_DOWNLOAD_URL }}"     | npx wrangler secret put B2_DOWNLOAD_URL     --name chronex-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
